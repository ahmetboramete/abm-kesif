<style>
:root{

  --ink:#121212; --bg:#F4F4F1; --card:#FFFFFF; --sari:#FFC20E; --sari-acik:#FFFBEA;

.govde{flex-grow:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.alt{flex-shrink:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--ink);background:var(--bg);display:grid;gap:10px}

<script>
/* ===== Depo: bulut (db + assets) varsa orada, yoksa bu cihazda (IndexedDB) ===== */
const Depo = (() => {
  let mod = 'baslatiliyor';
  let db = null, assets = null, idbP = null;
  const yerelDinleyiciler = new Map();
  const zincir = new Map();       // yol -> çalışan yazma
  const bekleyen = new Map();     // yol -> {veri|null(sil)}
  const urlOnbellek = new Map();

  function idbAc() {
    if (idbP) return idbP;
    idbP = new Promise((coz, red) => {
      let istek;
      try { istek = indexedDB.open('abm-kesif', 2); } catch (e) { red(e); return; }
      istek.onupgradeneeded = () => {
        const v = istek.result;
        if (!v.objectStoreNames.contains('belgeler')) v.createObjectStore('belgeler', { keyPath: 'yol' });
        if (!v.objectStoreNames.contains('dosyalar')) v.createObjectStore('dosyalar');
        if (!v.objectStoreNames.contains('kuyruk')) v.createObjectStore('kuyruk', { keyPath: 'yol' });
      };
      istek.onsuccess = () => coz(istek.result);

        el.querySelector('[data-kapat]').onclick = () => { sayfaKapat(); coz(false); };
        el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { sayfaKapat(); coz(b.dataset.h === '1'); });
      });
  });
}

/* ===== Abonelikler ===== */
function projelereAbone() {
  if (S.abone.projeler) return;
  S.abone.projeler = Depo.dinle('projeler', l => { S.projeler = l; if (S.ekran === 'projeler' || S.ekran === 'proje') ciz(); },
    e => bildir(hataMetni(e), true));
}
function projeyeAbone(pid) {
  ['mahaller', 'fotolar'].forEach(k => { if (S.abone[k]) { S.abone[k](); S.abone[k] = null; } });
  S.mahaller = []; S.fotolar = [];
  S.abone.mahaller = Depo.dinle(`projeler/${pid}/mahaller`, l => { S.mahaller = l.map(m => NotPanel.yerelSurum(m)); if (S.ekran === 'proje' || S.ekran === 'ozet') ciz(); });
  S.abone.fotolar = Depo.dinle(`projeler/${pid}/fotolar`, l => {
    S.fotolar = l;
    l.forEach(f => { if (f.ref && f.ref.startsWith('l:') && !Depo.fotoURLHizli(f.ref)) Depo.fotoURL(f.ref).then(() => { if (S.ekran === 'proje') ciz(); }); });
    if (S.ekran === 'proje' || S.ekran === 'ozet') ciz();
    else if (S.ekran === 'editor') Editor.disGuncelleme(foto(S.fid));
  });
}

/* ===== Ekranlar ===== */
function git(ekran, ek = {}) {
  if (S.ekran === 'editor' && ekran !== 'editor') Editor.kapat();
  if (S.ekran === 'plan' && ekran !== 'plan') Plan.kapat();
  Object.assign(S, ek);
  S.ekran = ekran;
  ciz();
}
function ciz() {
  const k = $('#ekran');
  if (S.ekran === 'yukleniyor') { k.innerHTML = `<div class="bas"><div class="marka" style="padding-left:8px"><span class="abm">ABM</span><span class="ad"><b>KEŞİF ve METRAJ</b><span>AÇILIYOR…</span></span></div></div><div class="govde"></div>`; return; }
  if (S.ekran === 'projeler') return cizProjeler(k);
  if (S.ekran === 'proje') return cizProje(k);
  if (S.ekran === 'editor') return Editor.ac(k, foto(S.fid));
  if (S.ekran === 'ozet') return cizOzet(k);
  if (S.ekran === 'plan') return Plan.ac(k, S.planMid);
}
const modMetni = () => Depo.mod === 'bulut' ? 'BULUTA KAYDEDİLİYOR' : Depo.mod === 'yerel' ? 'BU CİHAZA KAYDEDİLİYOR' : 'KAYIT YOK · SAYFA KAPANINCA SİLİNİR';
const durumCip = () => Depo.mod === 'bulut' ? '<span class="durum">Buluta kaydediliyor</span>' : Depo.mod === 'yerel' ? '<span class="durum">Cihaza kaydediliyor</span>' : '<span class="durum yerel">Kayıt yok</span>';

function cizProjeler(k) {
  const liste = S.projeler.slice().sort((a, b) => (b.guncelleme || '').localeCompare(a.guncelleme || ''));
  k.innerHTML = `
    <div class="bas" style="padding:10px 14px">
      <div class="marka" style="flex-grow:1"><span class="abm">ABM</span><span class="ad"><b>KEŞİF ve METRAJ</b><span>${modMetni()} · v15</span></span></div>
    </div>
    <div class="govde">
      ${liste.length ? liste.map(p => `
        <button type="button" class="kart" data-proje="${esc(p.id)}" style="text-align:left;cursor:pointer">
          <span class="kart-bas"><b>${esc(p.ad || 'Adsız keşif')}</b><span class="olcu"></span>${ikon('ileri', 20, 2.4)}</span>
          <span style="font-size:15px;color:var(--gri)">${esc([p.musteri, p.adres].filter(Boolean).join(' · ') || 'Müşteri bilgisi yok')}</span>
          <span class="not-kucuk">${esc(tarihYaz(p.tarih))}</span>
        </button>`).join('') : `
        <div class="bos"><b>İlk keşfini başlat</b>
          <ol><li>Sahada: tabletin kamerasıyla fotoğraf çek, ölçü ve notları al.</li><li>Ofiste: keşif aç, mahalleri ekle, planını çiz, kenar ölçülerini gir.</li><li>Kapı/pencereyi duvara ekle, fotoğrafları galeriden bağla.</li><li>Metraj tablosunu (CSV) ve planı (DXF) Drive'a kaydet.</li></ol>
        </div>`}
    </div>
    <div class="alt"><button type="button" class="btn btn-sari" data-yeni-proje="1" style="min-height:64px">${ikon('arti', 26)} YENİ KEŞİF</button>
      <div class="izgara2"><button type="button" class="btn btn-kucuk" data-drive-ac="1">DRIVE'DAN AÇ</button><label for="dosya-yedek" class="btn btn-kucuk" data-yedek-yukle="1" role="button" tabindex="0" style="cursor:pointer">YEDEKTEN YÜKLE</label></div></div>`;
  const yy = k.querySelector('[data-yedek-yukle]');
  yy.addEventListener('click', () => { const inp = document.getElementById('dosya-yedek'); if (inp) inp.value = ''; });
  yy.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); yy.click(); } });
  k.querySelectorAll('[data-proje]').forEach(b => b.onclick = () => projeAc(b.dataset.proje));
  k.querySelector('[data-yeni-proje]').onclick = () => projeSayfasi(null);
  k.querySelector('[data-drive-ac]').onclick = () => DriveSync.acSayfasi();
}
function projeAc(pid) {
  if (S.pid !== pid) { S.pid = pid; projeyeAbone(pid); }
  git('proje');
  DriveSync.planla(4000);
}
function projeSayfasi(p) {
  sayfaAc(`${sayfaBas(p ? 'Keşfi düzenle' : 'Yeni keşif')}
    <label class="alan" for="p-ad"><span class="etiket">İş adı</span><input id="p-ad" class="yazi" type="text" placeholder="Örn. Daire tadilatı" value="${esc(p ? p.ad : '')}"></label>
    <label class="alan" for="p-mus"><span class="etiket">Müşteri</span><input id="p-mus" class="yazi" type="text" value="${esc(p ? p.musteri : '')}"></label>
    <label class="alan" for="p-adr"><span class="etiket">Adres</span><input id="p-adr" class="yazi" type="text" value="${esc(p ? p.adres : '')}"></label>
    ${p ? `<button type="button" class="btn btn-kucuk" data-yedek="1">${ikon('indir', 20)} YEDEK AL (FOTOĞRAFLARLA)</button>
    ${DriveSync.bagli() ? `<button type="button" class="btn btn-kucuk" data-tablet-kaldir="1"${DriveSync.tamamMi() ? '' : ' style="opacity:.45"'}>TABLETTEN KALDIR (DRIVE'DA KALIR)</button>` : ''}
    <button type="button" class="btn btn-kirmizi btn-kucuk" data-sil="1">${ikon('sil', 20)} KEŞFİ SİL</button>` : ''}
    <button type="button" class="btn btn-siyah" data-kaydet="1">KAYDET</button>`,
    el => {
      el.querySelector('[data-kapat]').onclick = sayfaKapat;
      if (!p) setTimeout(() => el.querySelector('#p-ad').focus(), 50);
      el.querySelector('[data-kaydet]').onclick = () => {
        const simdi = new Date().toISOString();
        const veri = { ...(p || {}), ad: el.querySelector('#p-ad').value.trim() || 'Adsız keşif', musteri: el.querySelector('#p-mus').value.trim(), adres: el.querySelector('#p-adr').value.trim(), guncelleme: simdi };
        if (!p) { veri.tarih = simdi; veri.olusturma = simdi; }
        delete veri.id;
        const id = p ? p.id : Depo.yeniId();
        kaydet(`projeler/${id}`, veri);
        S.projeler = S.projeler.filter(x => x.id !== id).concat([{ id, ...veri }]);
        sayfaKapat();
        if (!p) projeAc(id);
      };
      const tk = el.querySelector('[data-tablet-kaldir]');
      if (tk) tk.onclick = () => { sayfaKapat(); DriveSync.tablettenKaldir(); };
      const yd = el.querySelector('[data-yedek]');
      if (yd) yd.onclick = () => yedekAl(p);
      const s = el.querySelector('[data-sil]');
      if (s) s.onclick = async () => {
        if (!(await onayIste(`"${p.ad}" keşfi ve içindeki tüm mahaller ile fotoğraflar silinecek.`))) return;
        for (const f of S.fotolar) { await Depo.fotoSil(f.ref); await Depo.sil(`projeler/${p.id}/fotolar/${f.id}`).catch(() => {}); }
        for (const m of S.mahaller) await Depo.sil(`projeler/${p.id}/mahaller/${m.id}`).catch(() => {});
        await Depo.sil(`projeler/${p.id}`).catch(e => bildir(hataMetni(e), true));
        git('projeler', { pid: null });
        bildir('Keşif silindi');
      };
    });
}
function projeDokun() {
  const p = proje(); if (!p) return;
  const v = { ...p, guncelleme: new Date().toISOString() }; delete v.id;
  kaydet(`projeler/${p.id}`, v);
  DriveSync.planla();
}

function cizProje(k) {
  const p = proje();
  if (!p) { k.innerHTML = `<div class="bas"><button class="ikon-btn" data-geri="1" aria-label="Keşiflere dön">${ikon('geri', 26)}</button><div class="baslik"><b>Keşif</b><span>Yükleniyor…</span></div></div><div class="govde"></div>`; k.querySelector('[data-geri]').onclick = () => git('projeler'); return; }
  const mahaller = mahalSirali();
  const toplamKroki = S.fotolar.filter(x => !x.ref).length;
  const toplamFoto = (S.fotolar.length - toplamKroki) + (toplamKroki ? ' FOTO · ' + toplamKroki + ' KROKİ' : '');
  k.innerHTML = `
    <div class="bas">
      <button class="ikon-btn" type="button" data-geri="1" aria-label="Keşiflere dön">${ikon('geri', 26)}</button>
      <div class="baslik"><b>${esc(p.ad)}</b><span>${esc([p.musteri, p.adres].filter(Boolean).join(' · ') || tarihYaz(p.tarih))}</span></div>

    </div>

      <span>${mahaller.length} MAHAL</span><span>${toplamFoto}${toplamKroki ? '' : ' FOTO'}</span><span>${esc(tarihYaz(p.tarih))}</span>
    </div>
    ${bekleyenSerit()}
    ${DriveSync.seritHtml()}
    <div class="govde">
      ${mahaller.length ? mahaller.map(m => {
        const fl = mahalFotolari(m.id);
        const pm = planMetraj(m);
        const olc = (pm ? [`A ${fmt(pm.alan)} m²`, `çevre ${fmt(pm.cevre)} m`] : [m.en != null && m.boy != null ? `${fmt(m.en)} × ${fmt(m.boy)}` : '']).concat([m.h != null ? `h ${fmt(m.h)}` : '']).filter(Boolean).join(' · ');
        return `<div class="kart">
          <button type="button" class="kart-bas" data-mahal-duzenle="${esc(m.id)}" style="border:0;background:transparent;padding:0;text-align:left;width:100%">
            <b>${esc(m.ad)}</b><span class="olcu">${esc(olc || 'ölçü girilmedi')}</span>${ikon('duzenle', 20)}
          </button>
          <div class="serit">
            <button type="button" class="kucuk plan-kucuk" data-plan="${esc(m.id)}" aria-label="${esc(m.ad)} planı">${m.plan && m.plan.kose && m.plan.kose.length > 1 ? planMiniSvg(m.plan, 40) : 'PLAN<br>ÇİZ'}</button>
            ${fl.map(f => `<button type="button" class="kucuk${f.ref ? '' : ' kroki-kucuk'}" data-foto="${esc(f.id)}" aria-label="${esc(m.ad + ' ' + yuzeyAdi(f.yuzey))}">${Depo.fotoURLHizli(f.ref) ? `<img src="${esc(Depo.fotoURLHizli(f.ref))}" alt="">` : ''}<i>${esc(f.yuzey)}${(f.notlar || []).length ? ' · ' + f.notlar.length : ''}</i></button>`).join('')}
            <button type="button" class="kucuk ekle" data-foto-cek="${esc(m.id)}" aria-label="${esc(m.ad)} için fotoğraf ekle">${ikon('galeri', 22)}</button>
          </div>
          <button type="button" class="kart-not" data-mahal-not="${esc(m.id)}">${ikon('defter', 20)}<span>${esc((m.not || '').split('\n').map(x => x.trim()).filter(Boolean).join(' · ') || 'Not ve detay çizimi yok')}</span>${(m.detaylar || []).filter(d => (d.cizgiler || []).length).length ? `<b>${(m.detaylar || []).filter(d => (d.cizgiler || []).length).length} ÇİZİM</b>` : ''}</button>
        </div>`;
      }).join('') : `<div class="bos"><b>Mahal ekle</b>Alttaki <b style="font-size:inherit">+</b> düğmesiyle mahali (oda, dükkan…) ekle, <b style="font-size:inherit">planını çiz</b>, kenar ölçülerini gir. Sahada çektiğin fotoğrafları sonra galeriden eklersin.</div>`}
    </div>
    <div class="alt" style="grid-template-columns:64px minmax(0,1fr) 64px">
      <button type="button" class="btn" data-mahal-ekle="1" aria-label="Mahal ekle" style="min-height:64px;padding:0">${ikon('arti', 28)}</button>
      <button type="button" class="btn btn-sari" data-foto-cek="" style="min-height:64px">${ikon('galeri', 26)} FOTOĞRAF EKLE</button>

  k.querySelector('[data-geri]').onclick = () => git('projeler');
  k.querySelector('[data-proje-menu]').onclick = () => projeSayfasi(p);

  k.querySelectorAll('[data-mahal-not]').forEach(b => b.onclick = () => {
    const mid = b.dataset.mahalNot;
    sayfaAc(`<div data-not-kok="1"></div>`, el => NotPanel.ac(el.querySelector('[data-not-kok]'), mid, { gomulu: true, kapat: () => { NotPanel.kapat(); sayfaKapat(); ciz(); } }));
  });
  k.querySelectorAll('[data-foto-cek]').forEach(b => b.onclick = () => fotoKaynakSec(b.dataset.fotoCek || null));
  k.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => git('plan', { planMid: b.dataset.plan }));
  DriveSync.seritKur(k);
}

function mahalSayfasi(m, sonra) {
  const adlar = S.ayarlar.mahalAdlari && S.ayarlar.mahalAdlari.length ? S.ayarlar.mahalAdlari : VARSAYILAN_ADLAR;
  sayfaAc(`${sayfaBas(m ? 'Mahali düzenle' : 'Yeni mahal')}
    <label class="alan" for="m-ad"><span class="etiket">Mahal adı</span><input id="m-ad" class="yazi" type="text" autocomplete="off" placeholder="Yaz ya da aşağıdan seç" value="${esc(m ? m.ad : '')}"></label>
    <div class="alan"><span style="display:flex;justify-content:space-between;align-items:baseline"><span class="etiket">Hızlı seç</span><button type="button" data-liste="1" style="border:0;background:transparent;padding:6px 0;font-weight:600;text-decoration:underline">Listeyi düzenle</button></span>
      <div class="cipler">${adlar.map(a => `<button type="button" class="cip" data-ad="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>
    <div class="alan"><span class="etiket">Ölçüler (cm) <span style="font-weight:500;text-transform:none">· yükseklik yeter; en/boy sadece plan çizmeyeceksen</span></span>
      <div class="izgara3">
        <label class="alan" for="m-en"><span class="not-kucuk">EN</span><input id="m-en" type="text" inputmode="decimal" value="${esc(m ? cmG(m.en) : '')}" placeholder="cm"></label>
        <label class="alan" for="m-boy"><span class="not-kucuk">BOY</span><input id="m-boy" type="text" inputmode="decimal" value="${esc(m ? cmG(m.boy) : '')}" placeholder="cm"></label>
        <label class="alan" for="m-h"><span class="not-kucuk">YÜKSEKLİK</span><input id="m-h" type="text" inputmode="decimal" value="${esc(m ? cmG(m.h) : '')}" placeholder="cm"></label>
      </div></div>
    ${m ? `<button type="button" class="btn btn-kirmizi btn-kucuk" data-sil="1">${ikon('sil', 20)} MAHALİ SİL</button>` : ''}
    <div class="izgara2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
      <button type="button" class="btn" data-kaydet="0">KAYDET</button>
      <button type="button" class="btn btn-sari" data-kaydet="1">${ikon('kalem', 22)} KAYDET, PLAN ÇİZ</button>
    </div>`,
    el => {
      el.querySelector('[data-kapat]').onclick = sayfaKapat;
      const adInput = el.querySelector('#m-ad');
      const cipGuncel = () => el.querySelectorAll('[data-ad]').forEach(c => c.setAttribute('aria-pressed', c.dataset.ad === adInput.value.trim() ? 'true' : 'false'));
      cipGuncel();
      adInput.addEventListener('input', cipGuncel);
      el.querySelectorAll('[data-ad]').forEach(c => c.onclick = () => {
        let ad = c.dataset.ad;
        const ayni = S.mahaller.filter(x => (!m || x.id !== m.id) && (x.ad === ad || x.ad.startsWith(ad + ' '))).length;
        if (ayni) ad = ad + ' ' + (ayni + 1);
        adInput.value = ad; cipGuncel();
      });
      el.querySelector('[data-liste]').onclick = () => adListesiSayfasi();
      el.querySelectorAll('[data-kaydet]').forEach(b => b.onclick = () => {
        const ad = adInput.value.trim();
        if (!ad) { bildir('Mahal adını yaz ya da listeden seç', true); adInput.focus(); return; }
        const veri = { ...(m || {}), ad, en: cmOku(el.querySelector('#m-en').value), boy: cmOku(el.querySelector('#m-boy').value), h: cmOku(el.querySelector('#m-h').value) };
        delete veri.id;
        if (!m) { veri.olusturma = new Date().toISOString(); veri.sira = S.mahaller.reduce((a, x) => Math.max(a, x.sira || 0), 0) + 1; }
        const id = m ? m.id : Depo.yeniId();
        kaydet(`projeler/${S.pid}/mahaller/${id}`, veri);
        if (!m) S.mahaller = S.mahaller.concat([{ id, ...veri }]);
        projeDokun();
        sayfaKapat();
        if (b.dataset.kaydet === '1' && !sonra) git('plan', { planMid: id });
        if (sonra) sonra(id);
      });
      const s = el.querySelector('[data-sil]');
      if (s) s.onclick = async () => {
        const fl = mahalFotolari(m.id);
        if (!(await onayIste(`"${m.ad}" ve ${fl.length} fotoğrafı silinecek.`))) return;
        for (const f of fl) { await Depo.fotoSil(f.ref); await Depo.sil(`projeler/${S.pid}/fotolar/${f.id}`).catch(() => {}); }
        await Depo.sil(`projeler/${S.pid}/mahaller/${m.id}`).catch(e => bildir(hataMetni(e), true));
        bildir('Mahal silindi');
      };
    });
}

  const adlar = S.ayarlar.mahalAdlari || VARSAYILAN_ADLAR;

}

    const pm = planMetraj(m);
    if (!pm || !pm.koseM) return;
    sayac++;
    const P = pm.koseM.map(q => [q[0] * 100, -q[1] * 100]);
    const minX = Math.min(...P.map(q => q[0])), maxX = Math.max(...P.map(q => q[0])), maxY = Math.max(...P.map(q => q[1]));

  g(0, 'ENDSEC'); g(0, 'EOF');
  return { metin: L.join('\r\n') + '\r\n', sayac };
}

  async function api(yol, ops = {}) {
    if (!bagli()) { const e = new Error('yetki'); e.code = 'yetki'; throw e; }
    const r = await fetch(yol, { ...ops, headers: { Authorization: 'Bearer ' + token, ...(ops.headers || {}) } });
    if (r.status === 401 || r.status === 403 && /auth|scope|token/i.test(await r.clone().text())) { token = null; bitis = 0; ls.koy('abm-drive-token2', null); const e = new Error('yetki'); e.code = 'yetki'; throw e; }
    if (r.status === 404) { const e = new Error('yok'); e.code = 'yok'; throw e; }
    if (!r.ok) { const e = new Error('drive ' + r.status); e.code = 'drive'; e.durum = r.status; throw e; }
    return r;
  }
  const kacis = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  // Türkçe harfler (İ = I + nokta gibi) farklı kodlanabilir: isimleri sadeleştirip karşılaştır
  const sade = s => String(s || '').normalize('NFC').replace(/I\u0307/g, 'İ').toLocaleUpperCase('tr-TR').replace(/\s+/g, ' ').trim();
  async function altKlasorler(ebeveyn) {
    const q = `mimeType='application/vnd.google-apps.folder' and trashed=false and '${ebeveyn}' in parents`;
    let sayfa = '', l = [];
    do {
      const r = await (await api(`${API}?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name)&spaces=drive&pageSize=1000${sayfa ? '&pageToken=' + encodeURIComponent(sayfa) : ''}`)).json();
      l = l.concat(r.files || []); sayfa = r.nextPageToken || '';
    } while (sayfa);
    return l;
  }
  async function klasorBul(ad, ebeveyn) {
    const hedef = sade(ad);
    const f = (await altKlasorler(ebeveyn)).find(x => sade(x.name) === hedef);
    return f ? f.id : null;
  }
  async function klasorBulYaDaAc(ad, ebeveyn) {
    const v = await klasorBul(ad, ebeveyn);
    if (v) return v;
    const r = await (await api(`${API}?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: ad, mimeType: 'application/vnd.google-apps.folder', ...(ebeveyn ? { parents: [ebeveyn] } : {}) }) })).json();
    return r.id;
  }
  async function varMi(id) {
    if (!id) return false;
    try { const r = await (await api(`${API}/${id}?fields=id,trashed`)).json(); return !r.trashed; } catch (e) { if (e.code === 'yok') return false; throw e; }
  }
  async function kokKlasor() {
    let id = ls.al('abm-drive-kok');
    if (id && await varMi(id)) return id;
    id = await klasorBulYaDaAc(KOK_AD, 'root');
    ls.koy('abm-drive-kok', id);
    return id;
  }
  async function dosyaYaz(id, ad, blob, ebeveyn) {
    const sinir = 'abm' + Math.random().toString(36).slice(2);
    const govde = meta => new Blob([`--${sinir}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${sinir}\r\nContent-Type: ${blob.type || 'application/octet-stream'}\r\n\r\n`, blob, `\r\n--${sinir}--`]);
    const h = { 'Content-Type': 'multipart/related; boundary=' + sinir };
    if (id) {
      try { return (await (await api(`${YUKLE}/${id}?uploadType=multipart&fields=id`, { method: 'PATCH', headers: h, body: govde({ name: ad }) })).json()).id; }
      catch (e) { if (e.code !== 'yok') throw e; }
    }
    return (await (await api(`${YUKLE}?uploadType=multipart&fields=id`, { method: 'POST', headers: h, body: govde({ name: ad, parents: [ebeveyn] }) })).json()).id;
  }
  const dosyaAdi = s => String(s || 'Keşif').replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 80) || 'Keşif';

  function csvMetni(satirlar) {
    const h = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const satir = [['Mahal', 'Kalem', 'Hesap', 'Miktar', 'Birim'].map(h).join(';')];
    satirlar.forEach(s => {
      s.kalemler.forEach(x => satir.push([s.mahal.ad, x.kalem, x.hesap, x.birim === 'adet' ? String(x.miktar) : fmt(x.miktar), x.birim].map(h).join(';')));
      if (s.not) s.not.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => satir.push([s.mahal.ad, 'Not', x, '', ''].map(h).join(';')));
    });
    return '﻿' + satir.join('\r\n');
  }

  function planla(ms = 6000) {
    if (!S.pid) return;
    clearTimeout(zaman);
    if (!bagli()) { yay(); return; }
    zaman = setTimeout(senkron, ms);
  }
  async function senkron() {
    const pid = S.pid, p = proje();
    if (!pid || !p || !bagli()) { yay(); return; }
    if (navigator.onLine === false) { durum[pid] = { ...(durum[pid] || {}), hata: 'internet' }; yay(); return; }
    if (calisiyor) { tekrar = true; return; }
    calisiyor = true;
    durum[pid] = { ...(durum[pid] || {}), kaydediliyor: true, hata: null }; yay();
    try {
      const kok = await kokKlasor();
      const d = { ...(p.drive || {}) };
      const ad = dosyaAdi(p.ad);
      // ABM Keşif Kayıtları/<keşif adı> ; keşif adı değişirse klasör adı da güncellenir
      if (!(await varMi(d.klasorId))) {
        d.klasorId = await klasorBulYaDaAc(ad, kok); d.klasorAd = ad;
        d.fotoKlasorId = null; d.jsonId = d.csvId = d.dxfId = null;
      } else if (d.klasorAd !== ad) {
        await api(`${API}/${d.klasorId}?fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: ad }) });
        d.klasorAd = ad;
      }
      if (!(await varMi(d.fotoKlasorId))) d.fotoKlasorId = null;
      // fotoğraflar: sadece yeni olanlar
      for (const f of S.fotolar.slice()) {
        if (S.pid !== pid) break;
        if (!f.ref || (f.driveId && f.driveRef === f.ref)) continue;
        if (!d.fotoKlasorId) d.fotoKlasorId = await klasorBulYaDaAc(FOTO_AD, d.klasorId);
        const b = await Depo.fotoBlob(f.ref);
        if (!b) continue;
        const m = mahal(f.mahalId);
        const fid = await dosyaYaz(f.driveRef === f.ref ? f.driveId : null, `${dosyaAdi(m ? m.ad : 'mahal')} - ${f.yuzey} - ${f.id}.jpg`, b.type ? b : new Blob([b], { type: 'image/jpeg' }), d.fotoKlasorId);
        const v = { ...(foto(f.id) || f), driveId: fid, driveRef: f.ref }; delete v.id;
        const i = S.fotolar.findIndex(x => x.id === f.id); if (i >= 0) S.fotolar[i] = { id: f.id, ...v };
        await Depo.yaz(`projeler/${pid}/fotolar/${f.id}`, v).catch(() => {});
      }
      if (S.pid !== pid) throw Object.assign(new Error('proje değişti'), { code: 'iptal' });
      const { satirlar } = metrajHesapla();
      d.csvId = await dosyaYaz(d.csvId, `${ad} - metraj.csv`, new Blob([csvMetni(satirlar)], { type: 'text/csv' }), d.klasorId);
      const dx = dxfOlustur(p);
      if (dx.sayac) d.dxfId = await dosyaYaz(d.dxfId, `${ad} - plan.dxf`, new Blob([cp1254Bayt(dx.metin)], { type: 'application/dxf' }), d.klasorId);
      // proje.json en son: içindeki dosya kimlikleri tam olsun (başka cihaz aynı dosyaları güncellesin)
      if (!d.jsonId) d.jsonId = await dosyaYaz(null, 'proje.json', new Blob(['{}'], { type: 'application/json' }), d.klasorId);
      const yedek = { tur: YEDEK_TUR, surum: 2, uygulama: 'ABM Keşif ve Metraj', alinma: new Date().toISOString(), proje: { ...p, drive: d }, mahaller: S.mahaller.slice(), fotolar: S.fotolar.map(f => { const x = { ...f }; delete x.veri; return x; }), ayarlar: S.ayarlar };
      d.jsonId = await dosyaYaz(d.jsonId, 'proje.json', new Blob([JSON.stringify(yedek)], { type: 'application/json' }), d.klasorId);
      if (JSON.stringify(d) !== JSON.stringify(p.drive || {})) {
        const v = { ...p, drive: d }; delete v.id;
        S.projeler = S.projeler.map(x => x.id === pid ? { id: pid, ...v } : x);
        await Depo.yaz(`projeler/${pid}`, v).catch(() => {});
      }
      durum[pid] = { zaman: Date.now(), hata: null, kaydediliyor: false };
    } catch (e) {
      console.error(e);
      durum[pid] = { ...(durum[pid] || {}), kaydediliyor: false, hata: e.code === 'yetki' ? 'yetki' : e.code === 'iptal' ? null : (navigator.onLine === false ? 'internet' : 'hata') };
    } finally {
      calisiyor = false;
      yay();
      if (tekrar) { tekrar = false; planla(1500); }
    }
  }

  function seritHtml() {
    const pid = S.pid; if (!pid) return '';
    const d = durum[pid] || {};
    const stil = (bg, renk = '#fff') => `style="display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;background:${bg};color:${renk};padding:8px 16px;font-weight:600;font-size:14px;flex-shrink:0;min-height:40px"`;
    if (!bagli()) return `<button type="button" data-drive-baglan="1" ${stil('#E9E9E4', 'var(--ink)')}>${ikon('indir', 18)}<span style="flex-grow:1">${d.hata === 'yetki' || hicBaglandi() ? 'Drive oturumu kapandı · kaydetmek için dokun' : 'Drive bağlı değil · otomatik kaydetmek için dokun'}</span><b>BAĞLAN</b></button>`;
    if (d.kaydediliyor) return `<div ${stil('var(--ink)')}><span>Drive'a kaydediliyor…</span></div>`;
    if (d.hata) return `<button type="button" data-drive-simdi="1" ${stil('var(--kirmizi)')}><span style="flex-grow:1">${d.hata === 'internet' ? 'İnternet yok · bağlanınca Drive\'a kaydedilecek' : 'Drive\'a kaydedilemedi'}</span><b>TEKRAR DENE</b></button>`;
    const saat = d.zaman ? new Date(d.zaman).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : null;
    return `<button type="button" data-drive-simdi="1" ${stil('#E9E9E4', 'var(--ink)')}><span style="flex-grow:1">${saat ? `Drive'a kaydedildi · ${saat} · ${esc(KOK_AD)} / ${esc(((proje() || {}).drive || {}).klasorAd || dosyaAdi((proje() || {}).ad))}` : 'Drive bağlı · değişiklikler otomatik kaydedilir'}</span><b>ŞİMDİ KAYDET</b></button>`;
  }
  function seritKur(k) {
    const b = k.querySelector('[data-drive-baglan]'); if (b) b.onclick = () => baglan();
    const s = k.querySelector('[data-drive-simdi]'); if (s) s.onclick = () => { if (!bagli()) baglan(); else { clearTimeout(zaman); senkron(); } };
  }

  // Bilgisayarda (ya da başka cihazda) Drive'daki keşfi aç
  async function listele() {
    const q = `name='proje.json' and trashed=false`;
    const l = await (await api(`${API}?q=${encodeURIComponent(q)}&fields=files(id,parents,modifiedTime)&spaces=drive&pageSize=100&orderBy=modifiedTime desc`)).json();
    const sonuc = [];
    for (const f of (l.files || [])) {
      try { const y = await (await api(`${API}/${f.id}?alt=media`)).json(); if (y && y.tur === YEDEK_TUR && y.proje) sonuc.push({ dosya: f, y }); } catch (e) { if (e.code === 'yetki') throw e; }
    }
    return sonuc;
  }
  async function iceAl({ dosya, y }) {
    const pid = y.proje.id || Depo.yeniId();
    const yerel = S.projeler.find(x => x.id === pid);
    if (yerel && !(await onayIste(`"${yerel.ad}" bu cihazda zaten var. Bu cihazdaki kopya silinip Drive'daki sürüm yüklenecek.`, 'DRIVE\'DAKİNİ YÜKLE'))) return;
    sayfaAc(`${sayfaBas('Drive\'dan açılıyor')}<p style="margin:0;font-size:17px" data-ilerleme="1">Keşif yükleniyor…</p>`);
    const ilerle = t => { const el = document.querySelector('[data-ilerleme]'); if (el) el.textContent = t; };
    try {
      if (yerel) {
        // bu cihazdaki eski mahal/fotoğraf belgelerini temizle
        if (S.pid !== pid) { S.pid = pid; projeyeAbone(pid); await new Promise(r => setTimeout(r, 400)); }
        for (const f of S.fotolar.slice()) { await Depo.fotoSil(f.ref); await Depo.sil(`projeler/${pid}/fotolar/${f.id}`).catch(() => {}); }
        for (const m of S.mahaller.slice()) await Depo.sil(`projeler/${pid}/mahaller/${m.id}`).catch(() => {});
      }
      const pr = { ...y.proje }; delete pr.id;
      pr.drive = { ...(pr.drive || {}), klasorId: (dosya.parents || [])[0] || (pr.drive || {}).klasorId, jsonId: dosya.id };
      await Depo.yaz(`projeler/${pid}`, pr).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; });
      for (const m of (y.mahaller || [])) { const v = { ...m }; delete v.id; await Depo.yaz(`projeler/${pid}/mahaller/${m.id || Depo.yeniId()}`, v).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; }); }
      const fl = y.fotolar || [];
      for (let i = 0; i < fl.length; i++) {
        ilerle(`Fotoğraf ${i + 1} / ${fl.length}…`);
        const f = { ...fl[i] }; const fid = f.id || Depo.yeniId(); delete f.id; delete f.veri;
        f.ref = null;
        if (f.driveId) {
          try { const b = await (await api(`${API}/${f.driveId}?alt=media`)).blob(); f.ref = await Depo.fotoYerelKoy(b.type ? b : new Blob([b], { type: 'image/jpeg' })); f.driveRef = f.ref; } catch (e) { if (e.code === 'yetki') throw e; }
        }
        await Depo.yaz(`projeler/${pid}/fotolar/${fid}`, f).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; });
      }
      if (y.ayarlar && Array.isArray(y.ayarlar.mahalAdlari) && y.ayarlar.mahalAdlari.length) { S.ayarlar = y.ayarlar; await Depo.yaz('ayarlar/genel', S.ayarlar).catch(() => {}); }
      sayfaKapat();
      S.projeler = S.projeler.filter(x => x.id !== pid).concat([{ id: pid, ...pr }]);
      S.pid = null;
      projeAc(pid);
      durum[pid] = { zaman: Date.now(), hata: null };
      bildir(`"${pr.ad}" Drive'dan açıldı`);
    } catch (e) {
      sayfaKapat();
      bildir(e && e.code === 'yetki' ? 'Drive oturumu kapandı, tekrar bağlan.' : 'Drive\'dan açılamadı. İnterneti kontrol edip tekrar dene.', true);
    }
  }
  async function acSayfasi() {
    if (!bagli()) { baglan(() => acSayfasi()); return; }
    sayfaAc(`${sayfaBas('Drive\'dan aç')}<p style="margin:0;font-size:17px">Drive'daki keşifler aranıyor…</p>`);
    let l;
    try { l = await listele(); }
    catch (e) { sayfaKapat(); bildir(e && e.code === 'yetki' ? 'Drive oturumu kapandı, tekrar bağlan.' : 'Drive okunamadı. İnterneti kontrol et.', true); return; }
    sayfaAc(`${sayfaBas('Drive\'dan aç')}
      ${l.length ? l.map((x, i) => `<button type="button" class="kart" data-dac="${i}" style="text-align:left;cursor:pointer"><span class="kart-bas"><b>${esc(x.y.proje.ad || 'Adsız keşif')}</b><span class="olcu"></span>${ikon('ileri', 20, 2.4)}</span><span style="font-size:15px;color:var(--gri)">${(x.y.mahaller || []).length} mahal · ${(x.y.fotolar || []).length} fotoğraf · son kayıt ${esc(new Date(x.dosya.modifiedTime).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</span></button>`).join('') : `<div class="bos">Drive'da kayıtlı keşif yok. Tablette keşfi açıp Drive'a bağlanınca "${esc(KOK_AD)}" klasörüne otomatik kaydedilir.</div>`}
      <p class="not-kucuk" style="margin:0">Drive'da "${esc(KOK_AD)}" klasöründeki keşifler.</p>`,
      el => {
        el.querySelector('[data-kapat]').onclick = sayfaKapat;
        el.querySelectorAll('[data-dac]').forEach(b => b.onclick = () => iceAl(l[Number(b.dataset.dac)]));
      });
  }

  // Bu keşfin son hali Drive'da mı? (tabletten kaldırmadan önce)
  function tamamMi() {
    const p = proje(), d = durum[S.pid] || {};
    if (!p || !d.zaman || d.kaydediliyor || d.hata) return false;
    if (zaman && calisiyor) return false;
    if (p.guncelleme && d.zaman < Date.parse(p.guncelleme)) return false;
    if (!p.drive || !p.drive.jsonId) return false;
    return S.fotolar.every(f => !f.ref || (f.driveId && f.driveRef === f.ref));
  }
  async function tablettenKaldir() {
    const p = proje(); if (!p) return;
    if (!tamamMi()) { bildir('Önce Drive\'a tam kaydedilmeli. "ŞİMDİ KAYDET"e dokunup bekle.', true); return; }
    if (!(await onayIste(`"${p.ad}" bu tabletten silinecek. Drive'daki kopya (${KOK_AD} / ${(p.drive || {}).klasorAd || p.ad}) olduğu gibi kalır; gerekirse "DRIVE'DAN AÇ" ile geri getirirsin.`, 'TABLETTEN KALDIR'))) return;
    const pid = p.id;
    clearTimeout(zaman);
    for (const f of S.fotolar.slice()) { await Depo.fotoSil(f.ref); await Depo.sil(`projeler/${pid}/fotolar/${f.id}`).catch(() => {}); }
    for (const m of S.mahaller.slice()) await Depo.sil(`projeler/${pid}/mahaller/${m.id}`).catch(() => {});
    await Depo.sil(`projeler/${pid}`).catch(() => {});
    S.projeler = S.projeler.filter(x => x.id !== pid);
    delete durum[pid];
    git('projeler', { pid: null });
    bildir('Tabletten kaldırıldı, Drive\'da duruyor');
  }
  window.addEventListener('online', () => { gsiYukle(); planla(3000); });
  return { gsiYukle, baglan, cikis, bagli, planla, senkron, seritHtml, seritKur, acSayfasi, tamamMi, tablettenKaldir, dinle: cb => { dinleyici.add(cb); return () => dinleyici.delete(cb); }, durum: () => durum[S.pid] || {} };
})();

/* ===== Mahal notları: yazı + elle detay çizimi (mahal belgesinde saklanır) ===== */
const NotPanel = (() => {
  const DW = 1200, DH = 800;            // çizim alanının iç ölçüsü (3:2)
  const HIZLI = ['Yapılacak: ', 'Hariç: ', 'Dikkat: ', 'Müşteri istedi: '];
  let kok = null, mid = null, sekme = 'yazi', detayId = null, ops = {};
  let cizgiler = [], gecmis = [], aktif = null, kalemGoruldu = false, arac = 'ince', temizleOnay = false;
  let kanvas = null, ctx = null, gozlemci = null;
  const bekleyen = new Map(); // mid -> zamanlayıcı
  const yerel = new Map();    // mid -> henüz yazılmamış alanlar (not, detaylar)
  const yeniDetayId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

  function kaydetGec(id, ek) {
    // S.mahaller içinde anında güncelle, belgeye 800 ms sonra yaz
    const i = S.mahaller.findIndex(x => x.id === id);
    if (i < 0) return;
    S.mahaller[i] = { ...S.mahaller[i], ...ek };
    yerel.set(id, { ...(yerel.get(id) || {}), ...ek });
    clearTimeout(bekleyen.get(id));
    bekleyen.set(id, setTimeout(() => yazSimdi(id), 800));
    durumYaz('Kaydediliyor…');
  }
  function yazSimdi(id) {
    clearTimeout(bekleyen.get(id)); bekleyen.delete(id);
    const m = mahal(id); yerel.delete(id); if (!m) return;
    const v = { ...m }; delete v.id;
    kaydet(`projeler/${S.pid}/mahaller/${id}`, v);
    projeDokun();
    durumYaz('Kaydedildi');
  }
  function hepsiniYaz() { [...bekleyen.keys()].forEach(yazSimdi); }
  function durumYaz(t) { const d = kok && kok.querySelector('[data-mnot-durum]'); if (d) d.textContent = t; }

  function detaylar() { const m = mahal(mid); return (m && Array.isArray(m.detaylar)) ? m.detaylar : []; }
  function detayKaydet() {
    const l = detaylar().map(d => d.id === detayId ? { ...d, cizgiler } : d);
    kaydetGec(mid, { detaylar: l });
  }

  function ac(kap, mid_, ops_) {
    if (kok && kok !== kap) kapat();
    kok = kap; mid = mid_; ops = ops_ || {};
    const m = mahal(mid);
    if (!m) { kok.innerHTML = '<div class="mnot-govde">Mahal bulunamadı.</div>'; return; }
    kok.classList.add('mnot');
    kok.classList.toggle('gomulu', !!ops.gomulu);
    const dl = detaylar();
    if (!dl.find(d => d.id === detayId)) detayId = dl.length ? dl[0].id : null;
    ciz();
  }
  function kapat() {
    hepsiniYaz();
    if (gozlemci) { gozlemci.disconnect(); gozlemci = null; }
    kanvas = null; ctx = null; aktif = null;
    kok = null;
  }

  function ciz() {
    if (!kok) return;
    const m = mahal(mid);
    const dl = detaylar();
    kok.innerHTML = `
      <div class="mnot-bas">${ikon('defter', 22)}<span class="mnot-ad">${esc(m ? m.ad : '')} · notlar</span>
        ${ops.gomulu ? '' : `<button type="button" class="ikon-btn" data-mnot-tam="1" aria-label="Tam ekran" aria-pressed="${kok.classList.contains('tam')}">${ikon('sigdir', 22)}</button>`}
        <button type="button" class="ikon-btn" data-mnot-kapat="1" aria-label="Notları kapat">${ikon('kapat', 22)}</button></div>
      <div class="mnot-sekme" role="tablist">
        <button type="button" class="cip" role="tab" data-mnot-sekme="yazi" aria-pressed="${sekme === 'yazi'}">YAZI</button>
        <button type="button" class="cip" role="tab" data-mnot-sekme="cizim" aria-pressed="${sekme === 'cizim'}">ÇİZİM${dl.filter(d => (d.cizgiler || []).length).length ? ' · ' + dl.filter(d => (d.cizgiler || []).length).length : ''}</button>

        kalemler.push({ kalem: 'Duvar alanı (net)', hesap: `(${kStr})×${fmt(m.h)}` + (dusP ? ` − boşluk ${fmt(dusP)}` : ''), miktar: net, birim: 'm²' });
        toplam.duvarNet += net;
      } else kalemler.push({ kalem: 'Duvar alanı', hesap: 'yükseklik girilmedi', miktar: null, birim: 'm²' });
      kalemler.push({ kalem: 'Tavan alanı', hesap: 'plandan', miktar: pm.alan, birim: 'm²' });
      kalemler.push({ kalem: 'Zemin alanı', hesap: 'plandan', miktar: pm.alan, birim: 'm²' });
      toplam.tavan += pm.alan; toplam.zemin += pm.alan;
      const kesen = pm.bosluklar.filter(b => b.tur !== 'pencere' && b.gen != null).reduce((x, b) => x + b.gen, 0);
      const sup = pm.cevre - kesen;
      kalemler.push({ kalem: 'Süpürgelik', hesap: `çevre ${fmt(pm.cevre)}${kesen ? ' − kapı/açıklık ' + fmt(kesen) : ''}`, miktar: sup, birim: 'mt' });
      toplam.supurgelik += sup;
      const uy = pm.uyarilar.concat(pm.tahminVar ? ['Bazı kenar ölçüleri girilmedi, çizimden tahmin edildi.'] : []);
      if (uy.length) kalemler.push({ kalem: 'UYARI', hesap: uy.join(' '), miktar: null, birim: '' });
    } else {
    let brut = null, hesap = '';
    // Aynı duvarın birden fazla sayfası olabilir (foto + kroki): her duvar bir kez, ölçülü ilk sayfadan
    const duvarHarita = new Map();
    fl.forEach(f => { if (duvarMi(f.yuzey) && f.gen != null && f.yuk != null && !duvarHarita.has(f.yuzey)) duvarHarita.set(f.yuzey, f); });
    const duvarlar = [...duvarHarita.values()].sort((a, b) => yuzeySira(a.yuzey) - yuzeySira(b.yuzey));
    if (m.en != null && m.boy != null && m.h != null) {
      // Mahal ölçüsünden 4 duvar; o duvara ayrı ölçü girildiyse (eğimli merdiven duvarı vb.) o ölçü kullanılır
      const dort = ['D1', 'D2', 'D3', 'D4'];
      const ayri = duvarlar.filter(f => dort.includes(f.yuzey) && (egimli(f) || Math.abs(yuzeyAlan(f) - (f.yuzey === 'D1' || f.yuzey === 'D3' ? m.en : m.boy) * m.h) > 0.0005));
      const ek = duvarlar.filter(f => !dort.includes(f.yuzey));
      if (!ayri.length && !ek.length) {
        brut = 2 * (m.en + m.boy) * m.h;
        hesap = `2×(${fmt(m.en)}+${fmt(m.boy)})×${fmt(m.h)}`;
      } else {
        const parca = dort.map(y => {
          const f = ayri.find(x => x.yuzey === y);
          if (f) return { a: yuzeyAlan(f), t: `${y} ${yuzeyHesapMetni(f)}` };
          const g = (y === 'D1' || y === 'D3') ? m.en : m.boy;
          return { a: g * m.h, t: `${y} ${fmt(g)}×${fmt(m.h)}` };
        }).concat(ek.map(f => ({ a: yuzeyAlan(f), t: `${f.yuzey} ${yuzeyHesapMetni(f)}` })));
        brut = parca.reduce((a, x) => a + x.a, 0);
        hesap = parca.map(x => x.t).join(' + ');
      }
    } else if (duvarlar.length) {
      brut = duvarlar.reduce((a, f) => a + yuzeyAlan(f), 0);
      hesap = duvarlar.map(f => `${f.yuzey} ${yuzeyHesapMetni(f)}`).join(' + ');
    }
    if (brut != null) {
      const net = brut - dus;
      kalemler.push({ kalem: 'Duvar alanı (net)', hesap: hesap + (dus ? ` − boşluk ${fmt(dus)}` : ''), miktar: net, birim: 'm²' });
      toplam.duvarNet += net;
    }
    if (m.en != null && m.boy != null) {
      const a = m.en * m.boy;
      kalemler.push({ kalem: 'Tavan alanı', hesap: `${fmt(m.en)}×${fmt(m.boy)}`, miktar: a, birim: 'm²' });
      kalemler.push({ kalem: 'Zemin alanı', hesap: `${fmt(m.en)}×${fmt(m.boy)}`, miktar: a, birim: 'm²' });
      toplam.tavan += a; toplam.zemin += a;
      const kesen = duvarBosluk.filter(b => b.tur !== 'pencere' && b.gen != null).reduce((x, b) => x + b.gen, 0);
      const sup = 2 * (m.en + m.boy) - kesen;
      kalemler.push({ kalem: 'Süpürgelik', hesap: `2×(${fmt(m.en)}+${fmt(m.boy)})${kesen ? ' − kapı/açıklık ' + fmt(kesen) : ''}`, miktar: sup, birim: 'mt' });
      toplam.supurgelik += sup;
    } else {
      fl.filter(f => (f.yuzey === 'Tavan' || f.yuzey === 'Zemin') && f.gen != null && f.yuk != null).forEach(f => {
        const a = f.gen * f.yuk;
        kalemler.push({ kalem: f.yuzey + ' alanı', hesap: `${fmt(f.gen)}×${fmt(f.yuk)}`, miktar: a, birim: 'm²' });
        if (f.yuzey === 'Tavan') toplam.tavan += a; else toplam.zemin += a;
      });
    }
    }
    const bListe = l => l.map(b => `${b.kod || ''} ${b.gen != null ? fmt(b.gen) : '?'}×${b.yuk != null ? fmt(b.yuk) : '?'}`).join(', ');
    ['kapi', 'pencere', 'balkon', 'aciklik'].forEach(t => {
      const l = bosluklar.filter(b => b.tur === t);
      if (!l.length) return;
      kalemler.push({ kalem: BOSLUK_TUR[t].ad, hesap: bListe(l), miktar: l.length, birim: 'adet' });
      toplam[t] += l.length;
    });
    // Boşluk ekranındaki ikinci kutucuk: kapıda "kapı boyası", pencerede "doğrama boyanacak"
    const boyaVar = b => b.kapiBoya != null ? b.kapiBoya : (b.tur === 'kapi' || b.tur === 'balkon');
    const kapiBoya = bosluklar.filter(b => (b.tur === 'kapi' || b.tur === 'balkon') && boyaVar(b));
    if (kapiBoya.length) { kalemler.push({ kalem: 'Kapı boyası', hesap: bListe(kapiBoya), miktar: kapiBoya.length, birim: 'adet' }); toplam.kapiBoya += kapiBoya.length; }
    const dogrBoya = bosluklar.filter(b => b.tur === 'pencere' && b.kapiBoya === true);
    if (dogrBoya.length) { kalemler.push({ kalem: 'Pencere doğrama boyası', hesap: bListe(dogrBoya), miktar: dogrBoya.length, birim: 'adet' }); toplam.dogramaBoya += dogrBoya.length; }
    satirlar.push({ mahal: m, kalemler, fotoSay: fl.length, not: (m.not || '').trim(), detaySay: (m.detaylar || []).filter(d => (d.cizgiler || []).length).length });
  });
  return { satirlar, toplam };
}

/* ===== Dosya verme: Paylaş menüsü (Drive vb.) ya da İndirilenler ===== */
function dosyaIndir(ad, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = ad; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000);
}
function paylasilabilir(ad, blob) {
  try { const d = new File([blob], ad, { type: blob.type }); return !!(navigator.canShare && navigator.canShare({ files: [d] })); } catch (e) { return false; }
}
// Hazır dosya için seçim paneli. Paylaş için kullanıcının dokunuşu gerekir, o yüzden ayrı düğme.
function dosyaVer(ad, blob, baslik, aciklama) {
  const paylas = paylasilabilir(ad, blob);
  sayfaAc(`${sayfaBas(baslik || 'Dosya hazır')}
    <p style="margin:0;font-size:16px;line-height:1.45"><b>${esc(ad)}</b>${aciklama ? '<br>' + aciklama : ''}</p>
    ${paylas ? `<button type="button" class="btn btn-sari" data-paylas="1">PAYLAŞ → DRIVE</button>` : ''}
    <button type="button" class="btn ${paylas ? '' : 'btn-sari'}" data-indir="1">${ikon('indir', 22)} CİHAZA İNDİR</button>
    <p class="not-kucuk" style="margin:0;line-height:1.45">${paylas ? 'Paylaş menüsünde <b>Drive</b>\'ı seç, iş klasörünü göster. ' : ''}İndirilen dosya tabletin <b>İndirilenler</b> klasörüne gider; Dosyalarım uygulamasından Drive'daki iş klasörüne taşıyabilirsin.</p>`,
    el => {
      el.querySelector('[data-kapat]').onclick = sayfaKapat;
      const p = el.querySelector('[data-paylas]');
      if (p) p.onclick = async () => {
        try { await navigator.share({ files: [new File([blob], ad, { type: blob.type })], title: ad }); sayfaKapat(); bildir('Paylaşıldı'); }
        catch (e) {
          if (e && e.name === 'AbortError') return;
          dosyaIndir(ad, blob); sayfaKapat();
          bildir('Paylaşılamadı (' + ((e && (e.name || e.message)) || 'bilinmeyen') + '). Dosya İndirilenler\'e kaydedildi.', true);
        }
      };
      el.querySelector('[data-indir]').onclick = () => { dosyaIndir(ad, blob); sayfaKapat(); bildir('İndirilenler klasörüne kaydedildi'); };
    });
}

async function csvIndir(p, satirlar) {
  const h = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const satir = [['Mahal', 'Kalem', 'Hesap', 'Miktar', 'Birim'].map(h).join(';')];
  satirlar.forEach(s => {
    s.kalemler.forEach(x => satir.push([s.mahal.ad, x.kalem, x.hesap, x.birim === 'adet' ? String(x.miktar) : fmt(x.miktar), x.birim].map(h).join(';')));
    if (s.not) s.not.split('\n').map(x => x.trim()).filter(Boolean).forEach(x => satir.push([s.mahal.ad, 'Not', x, '', ''].map(h).join(';')));
    if (s.detaySay) satir.push([s.mahal.ad, 'Not', s.detaySay + ' detay çizimi (uygulamada)', '', ''].map(h).join(';'));
  });
  const metin = '﻿' + satir.join('\r\n');
  const ad = ((p && p.ad) || 'kesif').replace(/[\\/:*?"<>|]/g, '').slice(0, 60) + ' - metraj.csv';
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: ad, data: metin }); bildir('Tablo indirildi'); }
    catch (e) { if (e && e.code !== 'declined') bildir('İndirilemedi. Tekrar dene.', true); }
    return;
  }
  dosyaVer(ad, new Blob([metin], { type: 'text/csv' }), 'Metraj tablosu', 'Excel\'de açılır (noktalı virgüllü CSV).');
}

/* ===== Yedek: proje + mahaller + fotoğraflar tek .json dosyada ===== */
const YEDEK_TUR = 'ABM-KESIF-YEDEK';
const blobDataURL = b => new Promise((coz, red) => { const r = new FileReader(); r.onload = () => coz(r.result); r.onerror = () => red(r.error); r.readAsDataURL(b); });
function dataURLBlob(u) {
  const v = u.indexOf(',');
  const tip = (u.slice(5, v).split(';')[0]) || 'image/jpeg';
  const ham = atob(u.slice(v + 1));
  const d = new Uint8Array(ham.length);
  for (let i = 0; i < ham.length; i++) d[i] = ham.charCodeAt(i);
  return new Blob([d], { type: tip });
}
const bugunMetni = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
async function yedekAl(p) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  const fl = S.fotolar.slice(), eksik = [];
  const fotolar = [];
  for (let i = 0; i < fl.length; i++) {
    sayfaAc(`${sayfaBas('Yedek hazırlanıyor')}<p style="margin:0;font-size:17px">Fotoğraf ${i + 1} / ${fl.length}…</p>`);
    const f = fl[i];
    let veri = null;
    if (f.ref) {
      const b = await Depo.fotoBlob(f.ref);
      if (b) { try { veri = await blobDataURL(b); } catch (e) { veri = null; } }
      if (!veri) eksik.push(f.id);
    }
    fotolar.push({ ...f, veri });
  }
  const yedek = { tur: YEDEK_TUR, surum: 1, uygulama: 'ABM Keşif ve Metraj v15', alinma: new Date().toISOString(), proje: { ...p }, mahaller: S.mahaller.slice(), fotolar, ayarlar: S.ayarlar };
  sayfaKapat();
  const ad = `ABM-KESIF - ${((p && p.ad) || 'kesif').replace(/[\\/:*?"<>|]/g, '').slice(0, 60)} - ${bugunMetni()}.json`;
  const yBlob = new Blob([JSON.stringify(yedek)], { type: 'application/json' });
  if (!dl) {
    dosyaVer(ad, yBlob, 'Yedek hazır', (eksik.length ? `<span style="color:var(--kirmizi)">${eksik.length} fotoğraf okunamadı (sadece ölçü/notları var).</span><br>` : '') + 'Fotoğraflar, ölçüler ve notlar bu tek dosyada. Drive\'daki iş klasörüne koy.');
    return;
  }
  try {
    await dl.save({ filename: ad, data: yBlob });
    bildir(eksik.length ? `Yedek indirildi, ama ${eksik.length} fotoğraf okunamadı (sadece ölçü/notları var).` : 'Yedek indirildi. Drive\'daki iş klasörüne koy.', eksik.length > 0);
  } catch (e) { if (e && e.code !== 'declined') bildir('Yedek indirilemedi. Tekrar dene.', true); }
}
async function yedekYukle(dosya) {
  let y;
  try { y = JSON.parse(await dosya.text()); } catch (e) { bildir('Dosya okunamadı. ABM Keşif yedeği (.json) seç.', true); return; }
  if (!y || y.tur !== YEDEK_TUR || !y.proje) { bildir('Bu dosya ABM Keşif yedeği değil.', true); return; }
  const pid = Depo.yeniId(), simdi = new Date().toISOString();
  const pr = { ...y.proje }; delete pr.id;
  if (S.projeler.some(x => x.ad === pr.ad)) pr.ad = (pr.ad || 'Keşif') + ' (yedekten)';
  pr.guncelleme = simdi;
  const midHarita = new Map();
  try {
    sayfaAc(`${sayfaBas('Yedek yükleniyor')}<p style="margin:0;font-size:17px">Keşif açılıyor…</p>`);
    await Depo.yaz(`projeler/${pid}`, pr).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; });
    for (const m of (y.mahaller || [])) {
      const id = Depo.yeniId(); midHarita.set(m.id, id);
      const v = { ...m }; delete v.id;
      await Depo.yaz(`projeler/${pid}/mahaller/${id}`, v).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; });
    }
    const fl = y.fotolar || [];
    for (let i = 0; i < fl.length; i++) {
      sayfaAc(`${sayfaBas('Yedek yükleniyor')}<p style="margin:0;font-size:17px">Fotoğraf ${i + 1} / ${fl.length}…</p>`);
      const f = { ...fl[i] }, veri = f.veri; delete f.veri; delete f.id;
      f.mahalId = midHarita.get(f.mahalId) || f.mahalId;
      f.ref = null;
      if (veri) { try { f.ref = await Depo.fotoYerelKoy(dataURLBlob(veri)); } catch (e) { f.ref = null; } }
      await Depo.yaz(`projeler/${pid}/fotolar/${Depo.yeniId()}`, f).catch(e => { if (!e || e.code !== 'kuyrukta') throw e; });
    }
  } catch (e) {
    sayfaKapat(); bildir(hataMetni(e), true); return;
  }
  sayfaKapat();
  S.projeler = S.projeler.filter(x => x.id !== pid).concat([{ id: pid, ...pr }]);
  projeAc(pid);
  setTimeout(yerelFotolariTasi, 800);
  bildir(`"${pr.ad}" yedekten yüklendi`);
}
